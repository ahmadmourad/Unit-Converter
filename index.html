<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="hero-section">
            <h1 class="hero-title"> Metric/Imperial Unit Conversion</h1>
            <input type="number" min="0" id="hero-input-el">
            <button id="hero-button-el">Convert</button>
        </div>

        <div id="conversions-section">
            <div class="units">
                <h1 class="units-title">Length (Meter/Feet)</h1>
                <p id="length-conv-el" class="units-body">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>

            <div class="units">
                <h1 class="units-title">Volume (Liters/Gallons)</h1>
                <p id="volume-conv-el" class="units-body">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </div>

            <div class="units">
                <h1 class="units-title">Mass (Kilograms/Pounds)</h1>
                <p id="mass-conv-el" class="units-body">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </div>

        </div>
        <script src="index.js"></script>
    </body>
</html>
