<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="hero-section">
            <h1 class="hero-title"> Metric/Imperial Unit Conversion</h1>
            <input type="number" min="0" id="hero-input-el" >
            <button id="hero-button-el">Convert</button>
        </div>

        <div id="conversions-section">
            <div class="units">
                <h1 class="units-title">Length (Meter/Feet)</h1>
                <p id="length-conv-el" class="units-body"> __ meters = __ feet | __ feet = __ meters</p>
            </div>

            <div class="units">
                <h1 class="units-title">Volume (Liters/Gallons)</h1>
                <p id="volume-conv-el" class="units-body">__ liters = __ gallons | __ gallons = __ liters</p>
            </div>

            <div class="units">
                <h1 class="units-title">Mass (Kilograms/Pounds)</h1>
                <p id="mass-conv-el" class="units-body">__ kilos = __ pounds | __ pounds = __ kilos</p>
            </div>

        </div>
        <script src="index.js"></script>
    </body>
</html>
